<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Hasan ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Dancing+Script:wght@500;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Hearts -->
    <div class="hearts"></div>

    <div class="container">

        <!-- Main Card -->
        <div class="birthday-card">

            <div class="sparkle">✨</div>

            <p class="small-text">A Special Day For Someone Special</p>

            <h1>Happy Birthday 🎂21</h1>

            <h2>Hasan ❤️</h2>

            <div class="arabic">
                زوجي العزيز
            </div>

            <!-- Cake -->
            <div class="cake">
                <div class="candle">
                    <div class="flame"></div>
                </div>

                <div class="cake-top"></div>
                <div class="cake-body">
                    <span>❤️</span>
                    <span>❤️</span>
                    <span>❤️</span>
                </div>
            </div>

            <!-- Countdown -->
             <div class="wish-date">
                    25 / 08 / 2026 🎂
                </div>
            <div class="countdown-section">
                <p>Counting down to your special day 🎂</p>

                <div id="countdown">
                    <div>
                        <span id="days">00</span>
                        <small>Days</small>
                    </div>

                    <div>
                        <span id="hours">00</span>
                        <small>Hours</small>
                    </div>

                    <div>
                        <span id="minutes">00</span>
                        <small>Minutes</small>
                    </div>

                    <div>
                        <span id="seconds">00</span>
                        <small>Seconds</small>
                    </div>
                </div>
            </div>

            <!-- Surprise Button -->
            <button id="surpriseBtn">
                💌 click here
            </button>

            <!-- Hidden Message -->
            <div id="message" class="message">

                <h3>To My Special One ❤️</h3>

                <p id="typingText"></p>

                <div class="signature">
                    With all my love,<br>
                    <strong>Faiza ❤️</strong>
                </div>
            </div>

        </div>

    </div>

    <!-- Music Button -->
 <audio id="birthdayMusic" loop>
    <source src="birthday.mp3" type="audio/mp3">
</audio>

<button id="musicBtn" class="music-btn">🎵</button>
    <script src="script.js"></script>

</body>
</html>
